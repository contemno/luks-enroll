name: Security scans

# Secret / SAST / filesystem-vulnerability scanning that complements audit.yml
# (which covers dependency *advisory* scans only). Three independent jobs:
#   gitleaks — scans git history for committed secrets
#   codeql   — SAST across the Python client and the Rust service
#   trivy    — filesystem vulnerability scan (OS packages + language deps)
#
# Intentionally NOT a required status check, same shape as audit.yml: it runs
# weekly + on PRs that touch this file, and a finding turns the job red
# (visible in the Actions tab / Security tab / as a non-required PR check),
# but it must NOT be added to branch protection -- these scanners' rulesets
# and advisory DBs change independently of any one PR's diff, so a new finding
# could otherwise block PRs that didn't introduce it.
#
# This ships disk-encryption key-handling code, so secret-scanning and SAST
# coverage are worth the low cost of a non-blocking weekly job (issue #106).
on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC, after audit.yml's 06:00 run
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/security.yml

permissions:
  contents: read

# Cancel superseded runs for the same PR when new commits are pushed.
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Scans the full git history for committed secrets. No license key is
  # required for personal-account public repos (this one); an org-owned repo
  # would additionally need a GITLEAKS_LICENSE secret.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs full history, not just the diff

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SAST across both languages. build-mode: none is correct for both: Python
  # is interpreted, and CodeQL's Rust extractor (GA since CodeQL 2.23.3)
  # parses source directly without invoking cargo -- no toolchain/C deps needed.
  #
  # NOTE: if the repo's Security settings have CodeQL "default setup" enabled,
  # this advanced (workflow-based) config will conflict with it -- disable
  # default setup first (Settings -> Code security -> Code scanning).
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  # Filesystem scan for known-vulnerable OS packages and language dependencies
  # (reads rust/Cargo.lock and any Python requirement files it finds), uploaded
  # as SARIF to the Security tab. Complements audit.yml's cargo-audit/pip-audit
  # (RustSec/PyPI-OSV advisory DBs only) with Trivy's broader vulnerability DB.
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-results.sarif
