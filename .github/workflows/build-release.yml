name: Build & Release

# Reusable workflow: lint, test, build the .deb for a given tag, then publish a
# GitHub release with the package attached. Called by:
#   * release.yml       — when a v* tag is pushed by a human (manual path)
#   * autotag.yml       — after it auto-creates a tag on push to dev/main
#   * pr-test-build.yml — with `publish: false`: build + run artifact only,
#                         no Releases-page entry
#
# It is factored out so both paths build and release identically. The release
# is created as a draft *with* the .deb attached and then flipped to published,
# which is required because this repo uses immutable releases (assets can only
# be attached while the release is still a draft).

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build and release.
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: true
        type: boolean
      publish:
        description: >-
          Create the GitHub release. When false, stop after uploading the run
          artifact (PR test builds).
        required: false
        type: boolean
        default: true
    outputs:
      artifact_id:
        description: GitHub ID of the uploaded build-artifact bundle.
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_url:
        description: Download URL for the run artifact (requires being logged in).
        value: ${{ jobs.build.outputs.artifact_url }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/python-setup

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/python-setup

      - name: Run tests
        run: python3 -m pytest tests/ -v

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates dpkg-dev debhelper devscripts \
            pkg-config clang libclang-dev \
            libcryptsetup-dev libblkid-dev libfido2-dev libtss2-dev \
            python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            libcryptsetup12 systemd

      # The distro rustc is too old for the workspace (Cargo.lock v4 / crate
      # MSRVs), so install a current stable toolchain via rustup.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # need full history + tags for changelog generation

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Cache the cargo home and target for the release (--release) build. This
      # build uses a non-default CARGO_HOME (debian/.cargo, set by debian/rules)
      # and builds into rust/target, so cache those paths explicitly. Distinct
      # key from the PR job (release profile != debug). Paired with `-nc` below so
      # the package `clean` step doesn't delete the restored cache.
      - name: Cache cargo home and target (release)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            debian/.cargo/registry/index
            debian/.cargo/registry/cache
            debian/.cargo/git/db
            rust/target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-

      - name: Generate debian/changelog from git history
        run: |
          DEBFULLNAME="GitHub Actions" \
          DEBEMAIL="actions@github.com" \
          ./scripts/gen-changelog.sh
          head -20 debian/changelog

      - name: Build package
        # -nc (--no-pre-clean) keeps the restored rust/target + debian/.cargo:
        # dpkg-buildpackage otherwise runs `debian/rules clean` first, whose
        # override_dh_auto_clean does `rm -rf rust/target debian/.cargo` and would
        # wipe the cache before the build. On a fresh CI checkout the pre-clean is
        # a no-op anyway, so the produced .deb is unchanged.
        run: dpkg-buildpackage -us -uc -b -nc

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp ../*.deb ../*.buildinfo ../*.changes artifacts/

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: luks-enroll-noble
          path: artifacts/

  release:
    needs: build
    # Skipped for PR test builds (publish: false): those ship as a run artifact
    # only. NOTE: this job's contents:write/id-token:write/attestations:write
    # still force every caller to grant them — GitHub validates nested job
    # permissions statically, even for jobs skipped by `if:`.
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # OIDC for cosign keyless signing + provenance attestation
      attestations: write    # attach the build-provenance attestation to this repo

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # CycloneDX SBOM of the built artifacts (.deb + .buildinfo/.changes),
      # attached to the release below. upload-artifact: false — we attach it
      # via the release assets, not a separate workflow-run artifact.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: artifacts
          format: cyclonedx-json
          output-file: artifacts/luks-enroll.cdx.json
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless signing: cosign mints a short-lived cert off this workflow's
      # OIDC identity via Sigstore's public Fulcio/Rekor, no stored key/secret.
      # The bundle (cert + signature + Rekor inclusion proof) is attached to
      # the release so `cosign verify-blob --bundle ... --certificate-identity
      # ...` can check it offline.
      - name: Sign the .deb (cosign keyless)
        run: |
          set -euo pipefail
          for deb in artifacts/*.deb; do
            cosign sign-blob --yes --bundle "${deb}.cosign.bundle" "${deb}"
          done

      # Native GitHub build-provenance attestation (SLSA-style, separate from
      # the cosign signature above): records that this .deb was built by this
      # workflow run from this commit, queryable via `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: artifacts/*.deb

      # This repository uses immutable releases: assets can only be attached
      # while the release is a draft, so create the draft with the assets first
      # and flip it to published as a separate step.
      - name: Create draft release with assets
        id: draft_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ inputs.ref }}
          files: |
            artifacts/*.deb
            artifacts/*.cosign.bundle
            artifacts/luks-enroll.cdx.json
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          draft: true

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${{ steps.draft_release.outputs.id }}" \
            -F draft=false --jq .html_url
